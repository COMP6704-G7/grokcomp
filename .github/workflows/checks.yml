name: Implementation and evidence checks

on:
  push:
  pull_request:

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install tested dependencies (CPU PyTorch)
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Check local implementation and protocol
        run: python -m pytest -q
      - name: Verify shipped source and experimental evidence
        run: python scripts/verify_release.py
